<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UDP Log Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 40px 24px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 32px;
  }

  .card {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 24px;
    max-width: 480px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin-bottom: 18px;
  }

  .field {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: #333;
  }

  input[type=text], input[type=number] {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: #555; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  input[type=range] {
    flex: 1;
    accent-color: #1a1a1a;
    cursor: pointer;
  }

  .slider-val {
    font-size: 14px;
    font-weight: 600;
    width: 44px;
    text-align: right;
  }

  .hint {
    font-size: 11px;
    color: #aaa;
    margin-top: 5px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    transition: background 0.12s;
  }

  button:hover { background: #f0f0f0; }

  #btnApply {
    background: #1a1a1a;
    color: white;
    border-color: #1a1a1a;
    flex: 1;
  }
  #btnApply:hover { background: #333; }

  #btnStart { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
  #btnStop  { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
  #btnStart:hover { background: #dcfce7; }
  #btnStop:hover  { background: #fee2e2; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    max-width: 480px;
    font-size: 13px;
    color: #555;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .dot.running { background: #16a34a; }
  .dot.stopped { background: #dc2626; }

  .signal {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    background: #f5f5f5;
    color: #888;
  }
  .signal.SLOW_DOWN { background: #fef2f2; color: #dc2626; }
  .signal.SPEED_UP  { background: #f0fdf4; color: #16a34a; }

  #error {
    display: none;
    font-size: 12px;
    color: #dc2626;
    padding: 10px 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    max-width: 480px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<h1>UDP Log Client</h1>
<p class="subtitle">Control panel — make sure UDPClient.py is running first</p>

<div id="error">Can't reach UDPClient.py. Is it running on the port below?</div>

<div class="card">
  <h2>Connection</h2>

  <div class="field">
    <label>Client name</label>
    <input type="text" id="machine" value="Machine-A" />
  </div>

  <div class="field">
    <label>Server IP</label>
    <input type="text" id="serverIP" value="127.0.0.1" />
  </div>

  <div style="display:flex; gap:12px;">
    <div class="field" style="flex:1">
      <label>Server UDP port</label>
      <input type="number" id="serverPort" value="20005" />
    </div>
    <div class="field" style="flex:1">
      <label>Client API port</label>
      <input type="number" id="uiPort" value="8765" />
    </div>
  </div>

  <div class="field">
    <label>Log frequency</label>
    <div class="slider-row">
      <input type="range" id="slider" min="0.2" max="5" step="0.1" value="1"
             oninput="document.getElementById('sliderVal').textContent = parseFloat(this.value).toFixed(1) + 's'" />
      <span class="slider-val" id="sliderVal">1.0s</span>
    </div>
    <p class="hint">Time between logs — server may override this via backpressure</p>
  </div>

  <button id="btnApply" onclick="apply()">Apply</button>
</div>

<div class="card">
  <h2>Controls</h2>
  <div class="btn-row">
    <button id="btnStart" onclick="setRunning(true)">▶ Start</button>
    <button id="btnStop"  onclick="setRunning(false)">⏸ Pause</button>
  </div>
</div>

<div class="status-bar">
  <div class="dot" id="dot"></div>
  <span id="statusText">—</span>
  <span class="signal" id="signalBadge">no signal</span>
</div>

<script>
function apiBase() {
  return `http://127.0.0.1:${document.getElementById("uiPort").value}`;
}

async function apply() {
  try {
    await fetch(apiBase() + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        machine:  document.getElementById("machine").value,
        server:   document.getElementById("serverIP").value,
        port:     parseInt(document.getElementById("serverPort").value),
        interval: parseFloat(document.getElementById("slider").value),
      })
    });
    document.getElementById("error").style.display = "none";
  } catch { document.getElementById("error").style.display = "block"; }
}

async function setRunning(val) {
  try {
    await fetch(apiBase() + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ running: val })
    });
  } catch { document.getElementById("error").style.display = "block"; }
}

async function poll() {
  try {
    const r = await fetch(apiBase() + "/");
    const s = await r.json();
    document.getElementById("error").style.display = "none";

    const dot = document.getElementById("dot");
    dot.className = "dot " + (s.running ? "running" : "stopped");

    document.getElementById("statusText").textContent =
      s.running
        ? `Sending as "${s.machine}" — ${s.sent} sent, every ${s.interval.toFixed(1)}s`
        : `Paused — ${s.sent} sent`;

    const badge = document.getElementById("signalBadge");
    badge.textContent = s.signal === "none" ? "no signal" : s.signal;
    badge.className   = "signal " + s.signal;

  } catch {
    document.getElementById("dot").className = "dot stopped";
    document.getElementById("statusText").textContent = "disconnected";
  }
}

poll();
setInterval(poll, 1200);
</script>
</body>
</html>
